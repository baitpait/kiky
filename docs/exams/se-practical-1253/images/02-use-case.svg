<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" fill="#f7fbff"/>
  <!-- system boundary -->
  <rect x="200" y="40" width="500" height="490" rx="6" fill="#fff" stroke="#0b3d5c" stroke-width="2"/>
  <text x="450" y="65" text-anchor="middle" fill="#0b3d5c" font-size="14" font-family="Noto Sans Arabic, DejaVu Sans, Arial" font-weight="bold">نظام التسجيل الجامعي الإلكتروني</text>
  <text x="450" y="82" text-anchor="middle" fill="#888" font-size="11" font-family="Noto Sans Arabic, DejaVu Sans, Arial">Package: Your_Full_Four_Part_Name</text>

  <!-- Student actor (left) -->
  <circle cx="80" cy="260" r="18" fill="none" stroke="#4A90D9" stroke-width="2.5"/>
  <line x1="80" y1="278" x2="80" y2="330" stroke="#4A90D9" stroke-width="2.5"/>
  <line x1="55" y1="300" x2="105" y2="300" stroke="#4A90D9" stroke-width="2.5"/>
  <line x1="80" y1="330" x2="58" y2="370" stroke="#4A90D9" stroke-width="2.5"/>
