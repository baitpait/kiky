  <text x="580" y="293" text-anchor="middle" fill="#111" font-size="11" font-family="Noto Sans Arabic, DejaVu Sans, Arial">المسجلة حالياً</text>

  <ellipse cx="580" cy="460" rx="100" ry="26" fill="#ffe8d6" stroke="#e76f51" stroke-width="2"/>
  <text x="580" y="465" text-anchor="middle" fill="#111" font-size="12" font-family="Noto Sans Arabic, DejaVu Sans, Arial">تسجيل الدخول</text>

  <!-- Associations student -->
  <line x1="105" y1="280" x2="250" y2="120" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="290" x2="265" y2="185" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="300" x2="265" y2="250" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="310" x2="245" y2="315" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="320" x2="245" y2="385" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="340" x2="260" y2="460" stroke="#555" stroke-width="1.5"/>

  <!-- Associations admin -->
  <line x1="795" y1="280" x2="695" y2="185" stroke="#555" stroke-width="1.5"/>
  <line x1="795" y1="300" x2="700" y2="280" stroke="#555" stroke-width="1.5"/>
  <line x1="795" y1="340" x2="680" y2="460" stroke="#555" stroke-width="1.5"/>

  <!-- include: confirm includes save (optional modeling note) -->
  <line x1="360" y1="413" x2="360" y2="434" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="375" y="430" fill="#2a9d8f" font-size="10" font-family="Noto Sans Arabic, DejaVu Sans, Arial">«include»</text>
</svg>