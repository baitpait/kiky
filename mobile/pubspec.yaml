name: kiddy_link
description: Kiddy Link — Connecting Home & Kindergarten
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  http: ^1.2.2
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  go_router: ^14.6.2
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.1
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700
