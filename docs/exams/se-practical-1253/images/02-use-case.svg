  <text x="80" y="400" text-anchor="middle" fill="#0b3d5c" font-size="14" font-family="Noto Sans Arabic, DejaVu Sans, Arial" font-weight="bold">الدارس</text>

  <!-- Admin actor (right) -->
  <circle cx="820" cy="260" r="18" fill="none" stroke="#e76f51" stroke-width="2.5"/>
  <line x1="820" y1="278" x2="820" y2="330" stroke="#e76f51" stroke-width="2.5"/>
  <line x1="795" y1="300" x2="845" y2="300" stroke="#e76f51" stroke-width="2.5"/>
  <line x1="820" y1="330" x2="798" y2="370" stroke="#e76f51" stroke-width="2.5"/>
  <line x1="820" y1="330" x2="842" y2="370" stroke="#e76f51" stroke-width="2.5"/>
  <text x="820" y="400" text-anchor="middle" fill="#0b3d5c" font-size="14" font-family="Noto Sans Arabic, DejaVu Sans, Arial" font-weight="bold">مشرف النظام</text>

  <!-- Use cases - student -->
  <ellipse cx="360" cy="120" rx="110" ry="28" fill="#E8F4FC" stroke="#4A90D9" stroke-width="2"/>
