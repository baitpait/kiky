  <text x="580" y="198" text-anchor="middle" fill="#111" font-size="11" font-family="Noto Sans Arabic, DejaVu Sans, Arial">لطالب</text>

  <ellipse cx="580" cy="280" rx="120" ry="30" fill="#fff0eb" stroke="#e76f51" stroke-width="2"/>
